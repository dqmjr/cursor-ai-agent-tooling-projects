name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-sentinel:
    name: mcp-sentinel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-sentinel
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: mcp-sentinel/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run smoke

  agent-control-room:
    name: agent-control-room
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-control-room
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: agent-control-room/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  verify-mcp:
    name: verify-mcp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verify-mcp
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: verify-mcp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
